# Конфигурация линтера ruff.
#
# Философия: ловим классы реальных ошибок (pyflakes F, ошибки E4/E7/E9),
# стилевые наборы (UP, I, SIM, RUF-стиль) — сознательно не выбраны:
# массовая правка стиля запланирована после полевого дебрифинга.
# try-except-pass (S110) и широкие except (BLE001) в этом коде — НАМЕРЕННЫЕ
# пути деградации полевого приложения (см. rack_ai.py, voice.py) — поэтому
# эти правила в отбор не входят.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
